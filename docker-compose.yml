services:
  # ── PostgreSQL Database Service (Only accessible to Backend & Prisma) ──
  db:
    image: postgres:16-alpine
    container_name: talentai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talentai
    # No ports exposed to host machine -> completely private & protected
    volumes:
      # Persistent PostgreSQL data storage
      - talentai_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Dedicated Prisma Container (Schema Push, Migrations & Database Sync) ──
  prisma:
    build:
      context: ./backend
      dockerfile: Dockerfile.prisma
    container_name: talentai_prisma
    restart: unless-stopped
    # No ports exposed to host or outside -> 100% private internal container
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/talentai?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  # ── Backend Node.js API Service (Isolated; No direct external access) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentai_backend
    restart: unless-stopped
    # No host ports mapped -> external clients cannot bypass Nginx to reach backend directly
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Connected internally to 'db' container over the isolated backend_net bridge
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/talentai?schema=public
      - JWT_SECRET=mock-jwt-secret-for-local-development-987654
      - UPI_ID=30062006@cnrb
      - UPI_NAME=MAYANK KUMAR ACHARYA
      - OWNER_UPI_ID=30062006@cnrb
      - OWNER_UPI_NAME=MAYANK KUMAR ACHARYA
      - FRONTEND_URL=http://localhost
    volumes:
      # Persistent storage volume for candidate resumes & recorded interview videos
      - talentai_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      prisma:
        condition: service_started
    networks:
      - frontend_net
      - backend_net

  # ── Frontend React + Nginx Web Server (The SINGLE public entrypoint) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentai_frontend
    restart: unless-stopped
    ports:
      # The only public gateways into your application
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - frontend_net

volumes:
  talentai_uploads:
    name: talentai_uploads
  talentai_db_data:
    name: talentai_db_data

networks:
  frontend_net:
    name: talentai_frontend_net
    driver: bridge
  backend_net:
    name: talentai_backend_net
    driver: bridge
